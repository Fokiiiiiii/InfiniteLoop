name: Sync upstream launcher release
on:
  workflow_dispatch:
  schedule:
    - cron: "30 20 * * *"
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: upstream-launcher-release
  cancel-in-progress: false

jobs:
  mirror:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Find and verify upstream release asset
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release="$(gh api repos/reiserFSs/InfiniteLoop/releases/latest)"
          tag="$(jq -r '.tag_name // empty' <<< "$release")"
          if [[ ! "$tag" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unexpected upstream release tag: $tag" >&2
            exit 1
          fi
          asset="$(jq -c '[.assets[] | select(.name == "AscNetLauncher.zip" and .state == "uploaded")][0] // empty' <<< "$release")"
          if [[ -z "$asset" ]]; then
            echo "Upstream release $tag has no uploaded AscNetLauncher.zip" >&2
            exit 1
          fi
          digest="$(jq -r '.digest // empty' <<< "$asset")"
          if [[ ! "$digest" =~ ^sha256:[[:xdigit:]]{64}$ ]]; then
            echo "Upstream release $tag has no valid SHA-256 asset digest" >&2
            exit 1
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "Release $tag is already mirrored."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/upstream"
          gh release download "$tag" --repo reiserFSs/InfiniteLoop --pattern AscNetLauncher.zip --dir "$RUNNER_TEMP/upstream"
          archive="$RUNNER_TEMP/upstream/AscNetLauncher.zip"
          printf '%s  %s\n' "$(cut -d: -f2 <<< "$digest")" "$archive" | sha256sum --check -
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "needed=true" >> "$GITHUB_OUTPUT"
      - name: Point the packaged updater at this repository
        id: prepare
        if: steps.upstream.outputs.needed == 'true'
        run: |
          archive="$RUNNER_TEMP/upstream/AscNetLauncher.zip"
          output="$RUNNER_TEMP/AscNetLauncher.zip"
          python3 Scripts/prepare_upstream_launcher_release.py "$archive" "$output" "$GITHUB_REPOSITORY"
          echo "archive=$output" >> "$GITHUB_OUTPUT"
      - name: Publish prebuilt launcher to this repository
        if: steps.upstream.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.upstream.outputs.tag }}
          ARCHIVE: ${{ steps.prepare.outputs.archive }}
        run: |
          gh release create "$TAG" "$ARCHIVE" \
            --repo "$GITHUB_REPOSITORY" \
            --title "AscNet Launcher v$TAG" \
            --notes "Prebuilt launcher mirrored from reiserFSs/InfiniteLoop release $TAG. The package updater points to $GITHUB_REPOSITORY (main)."
          echo "Published upstream launcher $TAG to $GITHUB_REPOSITORY."
